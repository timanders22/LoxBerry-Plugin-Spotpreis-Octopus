[AUTOUPDATE]
# Solange keine eigene Vorabfassung gepflegt wird, steht hier DIESELBE
# Fassung und stehen hier DIESELBEN Adressen wie in der release.cfg. Sonst
# bekaeme jemand, der Vorabfassungen einschaltet, eine Adresse auf ein
# Archiv angeboten, das es nicht gibt.
#
# Die VERSION-Zeile muss vorhanden sein, auch wenn PRERELEASECFG in der
# plugin.cfg leer ist und die Datei damit gar nicht abgerufen wird: eine
# prerelease.cfg ohne VERSION ist der schlechteste Fall, weil das Verhalten
# undefiniert ist, sobald sie doch einmal abgerufen wird.

VERSION=1.0.8
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/archive/refs/tags/v1.0.8.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/releases/tag/v1.0.8
