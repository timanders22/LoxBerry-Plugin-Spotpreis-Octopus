[AUTOUPDATE]
# Solange keine eigene Vorabfassung gepflegt wird, steht hier DIESELBE
# Fassung und stehen hier DIESELBEN Adressen wie in der release.cfg. Sonst
# bekaeme jemand, der Vorabfassungen einschaltet, eine Adresse auf ein
# Archiv angeboten, das es nicht gibt.
#
# Die VERSION-Zeile muss vorhanden sein. In dieser Linie ist PRERELEASECFG
# in der plugin.cfg GESETZT, die Datei wird also wirklich abgerufen - der
# Satz, der hier bis 1.1.3 stand ('auch wenn PRERELEASECFG leer ist'), traf
# auf dieses Plugin nicht zu. Und eine prerelease.cfg ohne VERSION bleibt
# der schlechteste Fall, weil das Verhalten dann undefiniert ist.

VERSION=1.1.7
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/archive/refs/tags/v1.1.7.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/releases/tag/v1.1.7
