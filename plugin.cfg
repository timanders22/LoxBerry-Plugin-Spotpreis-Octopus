[AUTHOR]
NAME=Octopus Dynamic Plugin Authors
EMAIL=octopus-dynamic@users.noreply.github.com

[PLUGIN]
VERSION=1.1.3
NAME=octopus
FOLDER=octopus
TITLE=Octopus Dynamic

[AUTOUPDATE]
# Selbstaktualisierung ueber das eigene Repository. Die Adressen zeigen
# ausdruecklich NICHT auf ein fremdes Repository - sonst boete LoxBerry
# irgendwann ein Downgrade auf einen fremden Stand an (Hausregel, belegt am
# Docker-Plugin).
#
# Die Fassung steht bewusst noch unter 1.0.0: solange nicht an echter
# Gegenstelle erprobt, bleibt es eine Vorabfassung. Wer 0.9.0 installiert hat,
# bekommt 0.9.1 angeboten; sobald 1.0.0 erscheint, greift es ebenso.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist der MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze entfaellt jede Fallunterscheidung im Code.
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
