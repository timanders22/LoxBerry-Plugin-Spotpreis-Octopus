; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Octopus Dynamic"
K02 = "Das Plugin holt die <b>Viertelstundenpreise</b> des Tarifs <b>dynamicOctopus</b> und stellt sie dem Miniserver zur Verfügung."
K03 = "Erste Schritte"
K04 = "<b>Einstellungen → Zugang zu Octopus:</b> E-Mail-Adresse, Passwort und Kundennummer eintragen und speichern. Die Kundennummer beginnt immer mit <code>A-</code> und steht im Octopus-Dashboard oben links oder auf jeder Rechnung.<br> <i>Kein Octopus-Vertrag?</i> Dann weiter unten den <b>Demo-Modus</b> einschalten — dann rechnet das Plugin mit simulierten Werten aus den offenen Börsenpreisen, und alles lässt sich vollständig durchtesten."
K05 = "<b>Test → Anmeldung prüfen</b> und <b>Preise jetzt abrufen.</b> Scheitert etwas, nennt die Meldung die Ursache; im Protokoll steht die Antwort im Wortlaut. Diese beiden Knöpfe sind die einzigen Stellen der Oberfläche, die Octopus fragen — sonst ruft nur der Minutentakt ab. Nach einer abgelehnten Anmeldung wartet der Takt 30 Minuten; <b>Anmeldung prüfen</b> versucht es sofort."
K06 = "<b>MQTT:</b> das im Reiter MQTT angezeigte Abo im MQTT-Gateway unter <i>Subscriptions</i> eintragen. <b>Das gilt für MQTT&#8209;Gateway&nbsp;V1</b> — dort kommt ohne diesen Eintrag am Miniserver nichts an, und das ist die häufigste Fehlerursache überhaupt. <b>Ab Fassung&nbsp;2</b> erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts. Welche Fassung Ihr Gateway hat, misst das Plugin selbst und schreibt es in den Reiter MQTT."
K07 = "<b>Einbindung in Loxone:</b> die sieben Schritte abarbeiten. Schritt 6 enthält die komplette Baustein-Liste zum Nachbauen."
K08 = "Warum wird nichts aufgeschlagen?"
K09 = "Octopus liefert bereits den fertigen <b>Brutto-Arbeitspreis</b>. Netzentgelte, Umlagen und Umsatzsteuer sind darin enthalten. Deshalb gibt es hier keine Preiszusammensetzung zum Ausfüllen — sie wäre eine Fehlerquelle ohne Nutzen."
K10 = "Warum sind die Preise für morgen leer?"
K11 = "Octopus bekommt die Börsenpreise für den nächsten Tag erst am späten Nachmittag. Vormittags gibt es nur die heutigen. Das Thema <code>morgen_ok</code> steht auf 1, sobald sie da sind. Bis dahin stehen <code>pm00</code>–<code>pm23</code> und die Tageswerte für morgen auf −1, und in <code>pr00</code>–<code>pr23</code> tragen die Stunden ohne Preis den Tageshöchstpreis (<code>pr_ersatz</code> zählt sie) — so hält der Spot Price Optimizer sie nie für günstig."
K12 = "Die Preisanzeige ist leer"
K13 = "Die Schnittstelle liefert nur Preise, wenn der Tarif <b>dynamicOctopus</b> läuft. Ohne diesen Tarif kommt eine leere Liste zurück — das ist kein Fehler des Plugins. Der Reiter Test sagt das ausdrücklich."
K14 = "Die Werte in Loxone ändern sich nicht mehr"
K15 = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Abruf aus, sieht in der App alles normal aus — nur die Preise stimmen nicht mehr. Deshalb das Thema <code>alter</code> auswerten: es zählt die Minuten seit dem letzten erfolgreichen Abruf, 9999 heißt noch nie. Eine Schwelle von 90 Minuten meldet zuverlässig einen Ausfall, ohne dass ein einzelner verpasster Durchlauf schon Alarm auslöst. Preis, Rang und Niveau nur zusammen mit <code>ok</code> = 1 verwenden: ohne gültige Preise gehen über MQTT nur <code>ok</code>, <code>alter</code>, das Lebenszeichen und <code>regelN_aktiv</code> = 0 hinaus, und −1 heißt nicht bekannt — −1 erfüllt auch Rang ≤ 3. Fehlt nur die laufende Viertelstunde, trägt <code>cur</code> den Tageshöchstpreis und <code>cur_fehlt</code> steht auf 1. Die Vorlage ab 1.1.16 neu importieren, damit die Grenzen von <code>alter</code> (bis 9999), <code>fenster_in</code> und <code>regelN_in</code> (bis 2880) gelten."
K16 = "Wo liegen meine Zugangsdaten?"
K17 = "In <code>config/plugins/octopus/zugang.json</code> mit Rechten 0600 — nicht in der Konfiguration, die diese Oberfläche anzeigt. Das Passwort wird nie angezeigt; ein leeres Feld löscht nichts. Zum Löschen gibt es einen eigenen Haken."
K18 = "Auflösung"
K19 = "Octopus liefert 15-Minuten-Werte. Das Plugin gibt beides aus: die Viertelstundenwerte für die Feinsteuerung (<code>cur</code>, <code>rank</code>, <code>fenster_*</code>) und Stundenmittel für alle Bausteine, die auf Stunden ausgelegt sind (<code>cur_h</code>, <code>rank_h</code>). Das günstigste Fenster wird im Viertelstundenraster gesucht und kann deshalb auch um 13:45 beginnen."
K20 = "Endpunkt für den Miniserver"
K21 = "Er liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist durch ein Token geschützt. Das Token wird beim ersten Speichern erzeugt und bleibt danach stehen — es steckt in den Adressen im Miniserver. Wer es neu würfelt, muss die Adressen dort anpassen."
K22 = "Einstellungen sichern und zurückspielen"
K23 = "Zwei Knöpfe im Reiter Einstellungen. Die Datei enthält alle Einstellungen <b>und das Aktionstoken</b> — ohne dieses stünden nach dem Zurückspielen alle Felder richtig, und das Plugin käme trotzdem nicht an die Anlage. Für den <b>Umzug auf einen zweiten LoxBerry</b> setzen Sie zusätzlich den Haken <i>Zugangsdaten mitsichern</i>; sonst fehlen dort E-Mail, Passwort und Kundennummer. Die Datei ist in beiden Fällen wie ein Passwort zu behandeln. Beim Zurückspielen gilt alles oder nichts: eine Datei mit einem einzigen unbrauchbaren Wert wird vollständig abgewiesen, und es ändert sich nichts."
K24 = "Warum schaltet mein Gerät im Viertelstundentakt?"
K25 = "Weil Octopus in Viertelstunden rechnet. Gegen das Takten gibt es zwei Mittel: je Regel eine <b>Mindestlaufzeit</b> und eine <b>Mindestpause</b> (zu kurze Pausen werden zugemacht, zu kurze Blöcke verlängert oder verworfen), und den Haken <b>Begonnene Blöcke zu Ende laufen lassen</b> im Fahrplaner. Der Haken ist ab Werk gesetzt: ohne ihn kann ein Gerät mitten im Betrieb abschalten, weil die neue Preisreihe drei Stunden später etwas Billigeres kennt."
K26 = "Steuerbare Verbrauchseinrichtung nach § 14a"
K27 = "Im Fahrplaner gibt es neben dem Leistungsbudget ein <b>zweites Budget</b> mit eigenem Zeitfenster. Es gilt zusätzlich zum ersten; die kleinere der beiden Schranken gewinnt. Wer zu bestimmten Zeiten nur eine verminderte Leistung ziehen darf, trägt sie dort ein."
K28 = "Woher weiß ich, ob sich das Ganze lohnt?"
K29 = "Der Reiter Test zeigt unter dem Fahrplan eine Zeile je Regel: was der geplante Zeitraum kostet, was es gekostet hätte, jetzt sofort einzuschalten, und die Differenz in ct/kWh und in Euro. Steht in der Spalte <i>fehlt</i> eine Zahl, konnte die Regel ihre Laufzeit nicht unterbringen — die Spalte <i>Zustand</i> nennt den Grund."
K30 = "Ausfall bemerken, ohne in Loxone zu verdrahten"
K31 = "Im Reiter Einstellungen lässt sich die <b>Benachrichtigung des LoxBerry</b> einschalten. Sie meldet in der Glocke der Kopfzeile, wenn seit einer einstellbaren Zahl von Stunden kein Preisabruf mehr gelungen ist, und wenn die Preise für morgen da sind. Für Loxone bleibt es beim Thema <code>alter</code>."
K32 = "Liefert Octopus Viertelstunden oder Stunden?"
K33 = "Der Reiter Test zeigt unten die <b>letzte Antwort von Kraken</b>, gekürzt: wann gefragt wurde, wie viele Preiseinträge kamen, ihre Schrittweite (15 oder 60 Minuten) und die Zeitzone der Zeitangaben, dazu die ersten und letzten drei Einträge im Wortlaut. Gemerkt wird sie nur, wenn der Minutentakt oder ein Knopf ohnehin abruft, in <code>data/plugins/octopus/kraken_antwort.json</code> mit Rechten 0600. Kennwort, Token und E-Mail stehen nie darin, die Kundennummer nur maskiert (<code>A-12****CD</code>)."
K34 = "Ansage über Echo-Geräte (Alexa-NG)"
K35 = "Als Ausgabeweg der Sprachausgabe steht <b>Alexa-NG</b> zur Wahl – das Plugin <a href='https://github.com/timanders22/LoxBerry-Plugin-Alexa-NG' target='_blank'>Alexa-NG</a> (<span class='sm-mono'>https://github.com/timanders22/LoxBerry-Plugin-Alexa-NG</span>) muss auf demselben LoxBerry laufen. Eingetragen werden das <b>Sprechtoken</b> aus Alexa-NG und wahlweise das Gerät oder die Gruppe (leer = Standardgerät). Octopus schickt jede Ansage per POST an <span class='sm-mono'>http://127.0.0.1:&lt;Webport&gt;/plugins/alexang/index.php</span> (Webport aus den Einstellungen des LoxBerry); nur eine Antwort <span class='sm-mono'>SPRECHEN;OK=1</span> gilt als gesendet. Antwortet Alexa-NG nicht oder mit einem Fehler (etwa 403 bei falschem Token, 503 ohne Anmeldung bei Amazon), nennen die Testansage im Reiter Test und das Protokoll den Code und den Grund. Das Token geht nie in die Sicherung; beim Zurückspielen bleibt das hinterlegte. Ab Werk ist der Weg nicht gewählt. Bei allen Ausgabearten steht vom Ansagetext nur die Länge im Protokoll und in der Antwort auf <span class='sm-mono'>aktion=say</span> (<span class='sm-mono'>TEXTLAENGE=</span>); nur beim Original-Audioserver nennt die Antwort den Text selbst (<span class='sm-mono'>TEXT=</span>), weil Loxone ihn dort ausgibt."
K36 = "Ansage über Google-Lautsprecher (Chromecast 4 Lox NG)"
K37 = "Als Ausgabeart steht auch <b>Google-Lautsprecher (Chromecast 4 Lox NG)</b> zur Wahl – das Plugin <a href='https://github.com/timanders22/LoxBerry-Plugin-Chromecast4lox' target='_blank'>Chromecast 4 Lox NG</a> (<span class='sm-mono'>https://github.com/timanders22/LoxBerry-Plugin-Chromecast4lox</span>) muss auf demselben LoxBerry laufen, ab der Fassung mit „Sprachausgabe für andere Plugins“ (1.3.15). Dort im Reiter Einstellungen die Sprachausgabe für andere Plugins einschalten, ein <b>Sprechtoken</b> festlegen und wahlweise ein Standardgerät wählen; hier dann das Token und wahlweise Gerät und Lautstärke eintragen. Octopus schickt jede Ansage per POST an <span class='sm-mono'>http://127.0.0.1:&lt;Webport&gt;/plugins/chromecast-4lox-ng/index.php</span>; nur HTTP 200 mit <span class='sm-mono'>SPRECHEN;OK=1</span> gilt als gesendet (der Dienst hat sie bei den verbundenen Lautsprechern eingereiht). Gelingt das nicht – etwa 403 bei falschem Token, 409 bei ausgeschalteter Sprachausgabe dort, 503 wenn der Dienst nicht läuft oder kein Lautsprecher verbunden ist –, entfällt die Ansage; es wird weder wiederholt noch auf einen anderen Lautsprecher ausgewichen. Testansage und Protokoll nennen Code und Grund, der Selbsttest im Reiter Test prüft das Token, ohne zu sprechen. Das Token geht nie in die Sicherung; beim Zurückspielen bleibt das hinterlegte. Ab Werk ist die Ausgabeart nicht gewählt. Seit 1.1.22 kommen die Einstellungen der Sprachausgabe aus dem gemeinsamen Baustein der Plugins dieses Hauses: Adresse und Vorlage des Music Servers müssen im Heimnetz liegen."
