; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Octopus Dynamic"
K02 = "Das Plugin holt die <b>Viertelstundenpreise</b> des Tarifs <b>dynamicOctopus</b> und stellt sie dem Miniserver zur Verfügung."
K03 = "Erste Schritte"
K04 = "<b>Einstellungen → Zugang zu Octopus:</b> E-Mail-Adresse, Passwort und Kundennummer eintragen und speichern. Die Kundennummer beginnt immer mit <code>A-</code> und steht im Octopus-Dashboard oben links oder auf jeder Rechnung.<br> <i>Kein Octopus-Vertrag?</i> Dann weiter unten den <b>Demo-Modus</b> einschalten — dann rechnet das Plugin mit simulierten Werten aus den offenen Börsenpreisen, und alles lässt sich vollständig durchtesten."
K05 = "<b>Test → Anmeldung prüfen</b> und <b>Preise jetzt abrufen.</b> Scheitert etwas, nennt die Meldung die Ursache; im Protokoll steht die Antwort im Wortlaut."
K06 = "<b>MQTT:</b> das dort angezeigte Abo im MQTT-Gateway unter <i>Subscriptions</i> eintragen. <b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K07 = "<b>Einbindung in Loxone:</b> die sieben Schritte abarbeiten. Schritt 6 enthält die komplette Baustein-Liste zum Nachbauen."
K08 = "Warum wird nichts aufgeschlagen?"
K09 = "Octopus liefert bereits den fertigen <b>Brutto-Arbeitspreis</b>. Netzentgelte, Umlagen und Umsatzsteuer sind darin enthalten. Deshalb gibt es hier keine Preiszusammensetzung zum Ausfüllen — sie wäre eine Fehlerquelle ohne Nutzen."
K10 = "Warum sind die Preise für morgen leer?"
K11 = "Octopus bekommt die Börsenpreise für den nächsten Tag erst am späten Nachmittag. Vormittags gibt es nur die heutigen. Das Thema <code>morgen_ok</code> steht auf 1, sobald sie da sind."
K12 = "Die Preisanzeige ist leer"
K13 = "Die Schnittstelle liefert nur Preise, wenn der Tarif <b>dynamicOctopus</b> läuft. Ohne diesen Tarif kommt eine leere Liste zurück — das ist kein Fehler des Plugins. Der Reiter Test sagt das ausdrücklich."
K14 = "Die Werte in Loxone ändern sich nicht mehr"
K15 = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Abruf aus, sieht in der App alles normal aus — nur die Preise stimmen nicht mehr. Deshalb das Thema <code>alter</code> auswerten: es zählt die Minuten seit dem letzten erfolgreichen Abruf. Eine Schwelle von 90 Minuten meldet zuverlässig einen Ausfall, ohne dass ein einzelner verpasster Durchlauf schon Alarm auslöst."
K16 = "Wo liegen meine Zugangsdaten?"
K17 = "In <code>config/plugins/octopus/zugang.json</code> mit Rechten 0600 — nicht in der Konfiguration, die diese Oberfläche anzeigt. Das Passwort wird nie angezeigt; ein leeres Feld löscht nichts. Zum Löschen gibt es einen eigenen Haken."
K18 = "Auflösung"
K19 = "Octopus liefert 15-Minuten-Werte. Das Plugin gibt beides aus: die Viertelstundenwerte für die Feinsteuerung (<code>cur</code>, <code>rank</code>, <code>fenster_*</code>) und Stundenmittel für alle Bausteine, die auf Stunden ausgelegt sind (<code>cur_h</code>, <code>rank_h</code>). Das günstigste Fenster wird im Viertelstundenraster gesucht und kann deshalb auch um 13:45 beginnen."
K20 = "Endpunkt für den Miniserver"
K21 = "Er liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist durch ein Token geschützt. Das Token wird beim ersten Speichern erzeugt und bleibt danach stehen — es steckt in den Adressen im Miniserver. Wer es neu würfelt, muss die Adressen dort anpassen."
