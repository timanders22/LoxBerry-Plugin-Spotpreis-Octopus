; Octopus Dynamic - English
;
; English is the fallback language, not German: whoever has set a third
; language will more likely understand English. This file must therefore
; always be complete.
; Put every value in double quotes: with parse_ini_file a ; starts a
; comment, and EVERY HTML entity ends in a semicolon (→ –).
; No double quote may appear inside a quoted value - use single quotes for
; HTML attributes: <span class='sm-mono'>.

