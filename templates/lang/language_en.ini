FRIST_KEINE = "no deadline"
H_FRIST = "The time it has to be finished by. If that time has passed today, tomorrow is meant. The planner then only searches up to that point - even if it would be cheaper later."
L_RANG = "Rank"
H_RANG = "1 picks first, 99 last. Only matters when a power budget is set: whoever is in front picks the cheap hours first."
L_LEISTUNG = "Power (kW)"
H_LEISTUNG = "What the appliance draws while running. 0 means: does not take part in the power budget."
L_ENERGIE = "Energy needed (kWh)"
H_ENERGIE = "Together with the power this gives the run time - 7 kWh at 3.7 kW is two hours. 0 means: the hours given above still apply."
L_PV_SPERRE = "Block above PV forecast (kWh)"
H_PV_SPERRE = "If the forecast for the next 24 hours exceeds this value, the rule stays silent. That keeps the battery from charging overnight when tomorrow is sunny. 0 = off."
L_SOC_MIN = "Battery from (%)"
L_SOC_MAX = "Battery up to (%)"
H_SOC = "The rule only runs while the state of charge is in between. 0 each = no limit. Without a configured battery source nothing is blocked - a missing reading is no reason to shut the house down."
FEHLER_ENERGIE_OHNE_LEISTUNG = "Rule %d: an energy figure also needs a power figure - otherwise the run time cannot be worked out."
FEHLER_SOC_REIHE = "Rule %d: „battery from“ has to be smaller than „battery up to“."

[EM]
EINLEITUNG = "Two function blocks come into question, and they do <b>not</b> do the same thing. The <b>Spot Price Optimizer</b> works with prices and switches during the cheapest hours. The <b>Energy Manager</b> distributes <b>surplus</b> from the PV system by priority - it has no price input."
EM_HINWEIS = "The Energy Manager knows nothing about prices. It sees grid power, production, storage power and state of charge. The rules of this plugin therefore act only indirectly: they permit grid import, force a start, or raise the minimum state of charge. If you want switching driven <b>purely</b> by price, connect the rule output straight to the load - without the Energy Manager at all."
EM_TEXT = "The Energy Manager distributes surplus. The switching rules intervene at three points - all three are connectable inputs on the block:"
H_EM = "Energy Manager - it has no price input"
H_SPOTOPT = "Spot Price Optimizer - this is where the hourly profile belongs"
H_TITEL = "Working together with the energy function blocks"
SPOTOPT_TEXT = "This block already exists in Loxone Config: it activates a given number of hours (<i>Demand</i>) within a period (<i>Period</i>) at the lowest prices. In <b>Spot Market</b> mode it fetches exchange prices itself - but that is the wrong price for Octopus: the dynamicOctopus tariff already delivers the finished <b>gross price</b> including all components, whereas the block receives exchange prices without taxes and expects a formula. So: set the block to <b>Absolute</b> or <b>Relative</b>, leave the formula field empty and take the values from here."
SPOTOPT_WARNUNG = "<b>Two things need attention.</b> First: the block only uses a value if it was updated <b>within the current hour</b> – otherwise it discards it as outdated. That is why the plugin sends the 24 hourly prices anew via MQTT every full hour (tick “Noncached” under gateway V2). Second: the block calculates in <b>whole hours</b>. The quarter-hour resolution of Octopus is lost. If you need it, use the switching rules of this plugin - they calculate in quarter hours."
T_ANSCHLUSS = "Connector on the block"
T_BEDEUTUNG = "Meaning"
T_VONHIER = "From this plugin"
Z_ABSOLUT = "<b>Absolute</b> mode: one input per hour of the day. ph00 to 00:00, ph01 to 01:00 and so on."
Z_MINSOC = "Raise the minimum state of charge while the rule applies (e.g. 80 % instead of 10 %). The storage is then charged with highest priority - together with a positive offset also from the grid."
Z_OFF = "Lock when the price is high: stop the whole block instead of a single load. Only sensible if <b>all</b> loads should depend on price."
Z_OFFSET = "Permit grid import while the rule applies. A positive value in kW means import is allowed - loads then run even without PV surplus."
Z_PRIO = "Feed the load number (1-12) while the rule applies. Starts exactly that load immediately. With a formula block: rule active - load number, otherwise 0."
Z_RELATIV = "<b>Relative</b> mode: one input per hour ahead. pr00 to +0, pr01 to +1 and so on."
Z_TRIGGER = "Trigger for the recalculation - e.g. the day pulse or plugging in the vehicle. Without a trigger the block does not recalculate."
HTTP_BESTAND = "existing installations (HTTP): %s"

[PLAN]
H_BUDGET2_KW = "For controllable consumption devices under section 14a EnWG: the reduced power that may be drawn at the times given below. It applies <b>in addition</b> to the budget above; the smaller of the two limits wins. 0 = off."
H_BUDGET2_ZEIT = "From and until equal means: all day — the same reading as for a rule's time window."
H_HYSTERESE = "Without this tick a device can switch off mid-operation because the new price series knows a cheaper quarter hour three hours later. With the tick a block stays until its end. On by default."
H_TITEL = "Planner - ranking, power budget and PV forecast"
ERKLAERUNG = "Up to 0.9.2 every switching rule worked on its own. Heat pump, wallbox and washing machine found the same cheapest hour and all switched on at once. The planner changes three things: rules can have a <b>deadline</b> and an energy figure, they share a <b>power budget</b> by rank, and a <b>PV forecast</b> moves the plan into the sunny hours. All three are off out of the box - change nothing and you get the previous behaviour."
H_UEBERSICHT = "What each rule intends — and what it saves"
L_BUDGET2_BIS = "applies until (hour)"
L_BUDGET2_KW = "Second budget (kW)"
L_BUDGET2_VON = "applies from (hour)"
L_BUDGET_KW = "Power budget (kW)"
H_BUDGET_KW = "This much may run at the same time. When it gets tight the rule with the lower rank gets the hour and the other one moves. 0 = no budget, then everything may run at once."
L_HYSTERESE = "Let started blocks run to their end"
L_PV_BONUS = "PV credit (ct/kWh)"
H_PV_BONUS = "Subtracted from the price of an hour when a PV forecast exists for it. That lets the sunny midday hour win against the cheap night hour. A sensible value is the difference between your import price and your feed-in tariff - what you save by using the energy yourself. 0 = off."
L_PV_SCHWELLE = "Full credit from (Wh per quarter hour)"
H_PV_SCHWELLE = "The credit rises linearly up to this value and then stays put. A plain yes/no threshold would be a cliff - the plan would jump by hours on a barely changed forecast."
