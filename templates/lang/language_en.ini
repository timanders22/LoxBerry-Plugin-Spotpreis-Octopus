[REGEL]
ART_FENSTER = "the N cheapest consecutive hours"
ART_MITTEL = "price X % below the daily average"
ART_SCHEIBEN = "the N cheapest quarter hours individually"
ART_SCHWELLE = "price below a fixed value"
ART_STUNDEN = "the N cheapest full hours"
ERKLAERUNG = "Up to 0.9.0 the plugin only delivered numbers: start time, minutes until then, average price. Turning that into “charge now” was work in the Miniserver. A switching rule answers the question here and outputs <b>a one or a zero</b>. Every rule knows a time window and a horizon, which makes “the 3 cheapest hours between 22:00 and 06:00” answerable. <b>Octopus works in quarter hours</b>: the rules operate on quarter-hour slots, so <span class='sm-mono'>in</span> and <span class='sm-mono'>rest</span> count in minutes. For “cheapest full hours” whole hours are averaged deliberately - otherwise the wallbox switches every 15 minutes."
H_AUSGANG = "Delivers <span class='sm-mono'>regel%d_aktiv</span> (0/1), <span class='sm-mono'>regel%d_in</span> (minutes until the next window), <span class='sm-mono'>regel%d_rest</span> (remaining minutes) and <span class='sm-mono'>regel%d_ct</span> (average in the window) - as an MQTT topic and in the Loxone template."
H_MIN_LAUF = "Shorter blocks are extended forwards; if that is not enough they are dropped. 0 = off. Heat pumps and compressors take damage when a threshold rule switches them every quarter hour."
H_MIN_PAUSE = "Shorter pauses are closed — the device keeps running instead of switching off and straight back on. 0 = off."
H_PROFIL = "The Loxone Spot Price Optimizer has <b>24</b> price inputs and does not accept quarter hours. The four quarter hours of each hour are therefore averaged. This changes nothing for the rules above - they keep working on quarter hours."
H_TITEL = "Switching rules - ready-made 0/1 signals for Loxone"
