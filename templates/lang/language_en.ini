[LOX]
H_SCHRITTE = "Step by step"
S1_T = "Step 1: switch on MQTT"
S1 = "<b>MQTT is the path of the LoxBerry plugins sample project</b> – for values and commands: the plugin sends its values via the UDP input of the MQTT gateway, the gateway passes them on to the Miniserver, and price announcement, announcement of tomorrow’s prices and test push come back via the command bridge. MQTT is on from the factory (<i>MQTT</i> tab). The HTTP path stays for existing installations – folded below."
S2_T = "Step 2: the MQTT gateway"
S2 = "The topic group of this plugin is:"
S3_T = "Step 3: create the virtual inputs"
S3 = "Create one <b>Virtual input</b> per value you need (not “Virtual HTTP input”), name exactly as in the table – the MQTT gateway delivers under this name. There is no template for the values: the names are enough. The table lists the inputs of the five sample pages; all further topics are folded below it."
SP_BEDEUTUNG = "Meaning"
DL_HTTP = "Template for command recognition (HTTP)"
DL_HILFE = "Load the downloaded file in Loxone Config via <b>File → Templates → Insert template</b>. The HTTP template contains the token in the address — if the token is regenerated, it has to be loaded again."
S4_T = "Step 4: commands"
S4 = "Price announcement, announcement of tomorrow’s prices and test push go via the <b>command bridge</b>: Loxone sends “publish …/befehl/&lt;name&gt; 1” to the UDP input of the MQTT gateway, the bridge listens on %s, checks and calls the same function as the HTTP endpoint. On the <i>MQTT</i> tab set the tick “Accept commands via MQTT” – off from the factory. All three commands are harmless; there is no second tick."
S5_T = "Step 5: failure detection"
S5 = "Virtual inputs keep their last value. If the fetch fails, everything looks normal in the app — only the prices are no longer correct. Three values make a failure visible: <span class='sm-mono'>ok</span> (0 = no prices), <span class='sm-mono'>alter</span> (minutes since the last successful fetch; a threshold switch On 90 / Off 30 minutes reports a failure without a single missed fetch raising an alarm) and the run counter <span class='sm-mono'>status_zaehler</span>, which counts up by one every minute. If the LoxBerry, the plugin or the MQTT gateway stops, <span class='sm-mono'>alter</span> also stays at its last value – then only the stopped run counter at a Value Validator (Tmc 900 s) gives it away. The page “Spotpreis Octopus” below combines all three into one fault message. At the Value Validator remove the tick at ‘En’ in the properties window – otherwise the constant 1 arrives as 0 and the message never fires."
S6_T = "Step 6: The blocks, five pages to rebuild"
S6 = "Work through each table from top to bottom – then the page is rebuilt. The blocks can be found in Loxone Config via the block search (F5). One row is one block; an AND or OR has exactly two inputs, and exactly one source hangs on each input."
B_TYP = "Block (type)"
B_NAME = "Name (suggestion)"
B_PARAM = "Parameters"
B_EIN = "Connect inputs to"
S7_T = "Step 7: verification"
S7 = "In Loxone Config look at the value of %s – it changes every minute. Then click <b>Send MQTT now</b> on the <i>Test</i> tab: the inputs must show the values in the <b>current</b> column on the <i>MQTT</i> tab. If they differ, the subscription (V1) or the tick (V2) is missing (step 2), or the name of the input does not match (step 3)."
BS_SP_NR = "#"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
BAUSTEINE_VORTEXT = "Five pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. If you only want to see the price and get messages, take over the first one alone; each further page stands on its own (no connection crosses a page boundary). The names of the virtual inputs follow the MQTT prefix set, “%s”."
DL_VQ = "Template for commands (virtual output)"
DL_PROFIL = "The plugin only sends the hourly prices <span class='sm-mono'>ph00</span> to <span class='sm-mono'>ph23</span> if “Hourly profile for the Spot Price Optimizer” in the Settings tab is set to “absolute” (or “both”) – it is off from the factory (for the page “Spotpreis Octopus Stundenprofil”)."
VQ_HILFE = "The template “Octopus Dynamic Befehle” contains the commands price announcement, announcement of tomorrow’s prices and test push including address and action token; read it in in Loxone Config under Periphery → Virtual Outputs → Import template. Download it again after “Create a new token”. “refresh” is deliberately not included: the minute cycle fetches the prices every 15 minutes anyway."
VQ_KOMMENTAR = "Octopus Dynamic: commands, contains the action token"
VQ_K_ANSAGE = "Octopus: price announcement now"
VQ_K_ANSAGE_MORGEN = "Octopus: announcement prices tomorrow"
VQ_K_TESTPUSH = "Octopus: test push notification"
BS1_KOPF = "Spotpreis Octopus – is the plugin running? Price now, messages and announcement"
BS1_S1 = "In the plugin tab “Settings” under “Octopus access” enter e-mail address, password and customer number (tariff dynamicOctopus required; without a contract switch on the “Demo mode”) and save. Tab “Test” → “Fetch prices now”: afterwards the prices appear in the chart. If you also take over the page “Spotpreis Octopus Stundenprofil”, set “Hourly profile for the Spot Price Optimizer” to “absolute” now and save – only then does the plugin send the hourly prices."
BS1_S2 = "In the plugin tab “MQTT” check that MQTT is switched on. Gateway V1: the plugin enters the subscription “octopus/#” itself; gateway V2: tick the data points of the list of ticks (step 2 above). If you use price announcement, announcement tomorrow and test push, set the tick “Accept commands via MQTT” in the tab “MQTT”."
BS1_S3 = "Step 3 above: create one Virtual input per value, name exactly as in the name table (button “copy”) – do not tick “Use as digital input”. There is no template for the values; the inputs serve all five pages. If you copy the sample project, you get them with it."
BS1_S4 = "Create the page “Spotpreis Octopus”. Drag the 13 inputs of the list (no. 1–9, 20, 21, 24, 33) and create the three commands no. 28, 30 and 32 on the shared output “LoxBerry MQTT-Gateway” (command on ON as in the list, command on OFF empty; if the output does not exist yet: step 4 above, “MQTT command template”), plus the constant 1. At octopus_cur switch on “Statistics” in the properties window."
BS1_S5 = "Create three virtual inputs (push button): “Taste Preisansage (Octopus)”, “Taste Ansage Preise morgen (Octopus)”, “Taste Test-Push (Octopus)”. Create three notifications: “Meldung Spotpreis gestört (Octopus)”, “Meldung Strompreis-Push (Octopus)”, “Meldung Test-Push (Octopus)”, text as in the list; each gets exactly one connection."
BS1_S6 = "Place the remaining blocks via the block search (F5), parameters as in the list, connect from top to bottom. Value Validator no. 11: remove the tick at ‘En’ in the properties window. “Spotpreis-Zustand (Octopus)” and “Strompreis jetzt (Octopus)” need one click on “+” first (V5); enter the status rows in the given order, the one without condition last."
BS1_S7 = "Text Generator no. 26 only with output type “Original Loxone Audioserver”: draw the connections no. 25 → Tr and no. 4 → V1 by hand and enter the text. With any other output type leave out no. 25 and 26, otherwise the announcement comes twice."
BS1_S8 = "Save and transfer. Check: “Spotpreis-Zustand (Octopus)” shows “läuft – Preise … Minuten alt”, octopus_status_zaehler counts up every minute; in the plugin tab “Test” “Send MQTT now” – the values in Loxone match the column “current” in the tab “MQTT”. Press “Taste Test-Push (Octopus)”: within one minute the “Meldung Test-Push (Octopus)” arrives."
BS1_H1 = "The fault message comes after 5 minutes without prices or with outdated prices (over 90 minutes); if LoxBerry, plugin or MQTT gateway have stopped completely, after about 20 minutes. During a plugin update the plugin pauses – a message then is no error."
BS1_H2 = "If the LoxBerry stops, all inputs keep their last value, octopus_alter too; only the stopped run counter (no. 3 at Value Validator no. 11) gives it away."
BS1_H3 = "On no. 11: Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
BS1_H4 = "The price message (no. 23) comes at the hours ticked in the plugin under “Announcement and notification”, and only with “Enable push notification”. Fault, price message and test push each have their own notification: a notification only sends on the change from off to on."
BS1_H5 = "A second press on a button within 60 seconds is acknowledged by the command bridge with “abgelehnt: Sperrminute”; the plugin itself accepts the announcements at most every 20 seconds and the test push every 10 seconds. The commands only work with the tick “Accept commands via MQTT”; they need no action token."
BS1_H6 = "Status inputs from V5 on only appear after a click on the “+” of the block."
BS2_KOPF = "Spotpreis Octopus Steuerung – the four switching rules with safeguard"
BS2_S1 = "In the plugin tab “Settings” under “Switching rules” switch on the rules you need (“Use switching rule 1” …) and set them up (type, e.g. the N cheapest hours in one go, number, time window, deadline); with several large consumers enter the power budget under “Planner”. Save."
BS2_S2 = "Create the new page “Spotpreis Octopus Steuerung” and drag the 25 inputs of the list (no. 1–24, plus octopus_status_zaehler once more as no. 25 – the inputs from step 3 above, do not create them again), plus the constant 1."
BS2_S3 = "Place the Value Validator, four AND and four Status via F5, parameters as in the list. Value Validator no. 27: remove the tick at ‘En’ in the properties window. At each AND (no. 28–31) invert input I2: click once on the input point of I2, the input then shows a small circle; then connect I2 with output E of no. 27."
BS2_S4 = "Each status “Schaltregel 1 (Octopus)” to “Schaltregel 4 (Octopus)” needs three clicks on “+” first (up to V7); enter the rows in the given order, the one without condition last."
BS2_S5 = "Connect the outputs Q of no. 28–31 to your own devices of the rules. Save and transfer. Check: as soon as a rule is set up, its status shows “wartet – Start in … min” or “läuft”."
BS2_H1 = "If the prices fail, the plugin sets the switching signals to 0 itself. If the LoxBerry stops, the AND blocks drop out after 15 minutes and the status shows “ausgesetzt”."
BS2_H2 = "The switching signals octopus_regel1_aktiv to octopus_regel4_aktiv go out on every run of the plugin (every minute) since 1.1.25, not only on a change: if a message gets lost at the MQTT gateway, the correct signal is there one minute later."
BS2_H3 = "On no. 27: Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
BS2_H4 = "Octopus calculates in quarter hours: “start in” and “rest” are minutes, the number “lost to the power budget” counts quarter hours. If you need only one rule, take over its six commands, its AND and its status; run counter, constant and Value Validator stay."
BS2_H5 = "Status inputs from V5 on only appear after a click on the “+” of the block."
BS3_KOPF = "Spotpreis Octopus Werte – today, tomorrow, cheapest window and planner"
BS3_S1 = "Create the new page “Spotpreis Octopus Werte” and drag the 24 inputs of the list (no. 1–24; the inputs from step 3 above, do not create them again). At octopus_cur_h switch on “Statistics” in the properties window."
BS3_S2 = "Create the notification “Meldung Preise für morgen (Octopus)”, text as in the list."
BS3_S3 = "Place four Status, Equal and Switch-On Delay via F5. Clicks on “+” first: “Strompreise heute (Octopus)” four times, “Strompreise morgen (Octopus)” twice, “Fahrplaner (Octopus)” twice. At “Equal” no. 29 leave the second input open and enter V2 = 0 in the properties window."
BS3_S4 = "Connect output Q of no. 30 to a device that should start in the cheapest window. Save and transfer. Check: compare “Strompreise heute (Octopus)” with the chart in the plugin (tab “Settings”)."
BS3_H1 = "The length of the cheapest window is set in the plugin; no. 30 is a ready-made switching output for a device with start release."
BS3_H2 = "The message “Preise für morgen” comes once a day as soon as the prices are published. If the program is transferred while octopus_morgen_ok is already 1, none comes on that day."
BS3_H3 = "“Fahrplaner (Octopus)” shows PV forecast, storage level and power budget the switching rules calculate with; the sources are entered in the plugin under “Planner”."
BS3_H4 = "Status inputs from V5 on only appear after a click on the “+” of the block."
BS4_KOPF = "Spotpreis Octopus Freigaben und Tarif – release when cheap, block when expensive, power mix, tariff comparison"
BS4_S1 = "Create the new page “Spotpreis Octopus Freigaben und Tarif” and drag the 15 inputs of the list (no. 1–6 as further instances, no. 18–21, 23–27; the inputs from step 3 above), plus the constant 1. At octopus_co2 switch on “Statistics” in the properties window."
BS4_S2 = "Value Validator no. 8: remove the tick at ‘En’ in the properties window. At AND no. 9 invert input I2: click once on the input point of I2, the input then shows a small circle."
BS4_S3 = "“Less or Equal” no. 10, “Greater or Equal” no. 11 and “Equal” no. 15: leave the second input open and enter V2 in the properties window (16, 1 and 3)."
BS4_S4 = "Place three Status; “Freigaben jetzt (Octopus)” and “Tarifvergleich (Octopus)” need one click on “+” first (V5). Rows in the given order, the one without condition last."
BS4_S5 = "Connect the outputs Q of no. 14 (release of large consumers), no. 16 (block at high price) and no. 21 (power mix clean) to your own consumers. Save and transfer."
BS4_H1 = "-1 means “rank unknown” and also satisfies “less or equal” – hence the AND with “Rang bekannt” (no. 11, 12). In the evening, while fewer than 12 future price hours are known, no. 14 releases only at a negative price."
BS4_H2 = "The releases switch only with valid prices and a living plugin (no. 9) and without delay; if the LoxBerry stops, they drop out after 15 minutes."
BS4_H3 = "On no. 8: Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
BS4_H4 = "How many quarter hours count as “cheap” is set at no. 10 (16 = 4 hours); “expensive” the plugin calculates itself against its threshold (factory setting 35 ct). CO₂ threshold and the fixed comparison price are set in the plugin."
BS4_H5 = "Status inputs from V5 on only appear after a click on the “+” of the block."
BS5_KOPF = "Spotpreis Octopus Stundenprofil – the Loxone block Spot Price Optimizer"
BS5_S1 = "In the plugin tab “Settings” set “Hourly profile for the Spot Price Optimizer” to “absolute” and save – it is off from the factory, and without this setting the plugin sends no hourly prices. Then create the 24 Virtual inputs octopus_ph00 to octopus_ph23 (step 3 above, name exactly like this); under gateway V2 tick them as “Noncached”."
BS5_S2 = "Create the new page “Spotpreis Octopus Stundenprofil” and drag the 24 inputs (no. 1–24), plus octopus_ok once more as no. 30. Set “Pulse at” no. 25 to “At specific time”, 00:05:00, and “Pulse at” no. 28 to 00:35:00; the OR no. 29 combines both."
BS5_S3 = "Place the Spot Price Optimizer via F5 and select the mode “Absolute” in the properties window. Config warns and recommends “Spot market” – confirm the warning with “Yes”. “Spot market” is the alternative entirely without the plugin: Loxone then fetches the exchange prices itself, without the final price from Octopus. Formula field empty, Demand 4 h, Period 24 h, Minimum Runtime 1 h."
BS5_S4 = "Connect by hand: the inputs 00:00 to 23:00 one after the other with octopus_ph00 to octopus_ph23, Tr with the output of no. 29, the inputs of the OR no. 29 with the outputs Q of no. 25 and no. 28; the outputs Cv, Min, Max, Avg and O to V1 to V5 of status no. 27 and octopus_ok (no. 30) to V6 (two clicks on “+” first)."
BS5_S5 = "Connect output O to your own consumer. Save and transfer."
BS5_H1 = "The Spot Price Optimizer works in whole hours; the quarter hours of Octopus are lost there. The switching rules of the page “Spotpreis Octopus Steuerung” switch more finely – if you use them, you do not need this page."
BS5_H2 = "The block only takes an hourly value if it was updated within the current hour; that is why the plugin sends the 24 hourly prices anew every full hour (“Noncached” under gateway V2). The recalculation at 00:35 catches up hourly prices that the gateway input lost at midnight."
BS5_H3 = "Prices in ct instead of EUR: the order of the hours stays the same, the parameter “Max” then applies in ct. All 33 connections of this page are drawn by hand (step 4)."
Z1_01 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_ok | 1 = valid prices available; 0 = no prices (then only status values come over MQTT: level and rank go to -1, switching rules to 0, all prices keep their last value) | —"
Z1_02 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_alter | age of the prices in minutes (the plugin calculates it and sends it every minute); 9999 = never fetched | —"
Z1_03 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_status_zaehler | run counter 0 to 999, counts up by one every minute – the sign of life | —"
Z1_04 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_cur | final price of the current quarter hour in ct/kWh (gross, all components); statistics on | —"
Z1_05 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_cur_fehlt | 1 = no price for this quarter hour, no. 4 carries the highest price of the day as a substitute | —"
Z1_06 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_next | final price of the next quarter hour in ct/kWh | —"
Z1_07 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_level | price level: 1 cheap (factory setting up to 20 ct), 2 normal, 3 expensive (factory setting from 35 ct), -1 unknown (with Spotpreis Tibber the level counts 0/1/2) | —"
Z1_08 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_rank | rank of the current quarter hour among the next 24 hours, 1 = cheapest; -1 = unknown (no prices or fewer than 12 future price hours) | —"
Z1_09 = "Virtual input (name as the MQTT gateway assigns it, plugin Spotpreis Octopus) | octopus_neg | 1 = net price negative | —"
Z1_10 = "Constant | Konstante 1 | value 1 | —"
Z1_11 = "Value Validator | Spotpreis-Plugin meldet sich nicht (Octopus) | Tmc 900 s (15 minutes without a new run counter), Min 0, Max 999; remove the tick at ‘En’ in the properties window | V = #3, En = #10"
Z1_12 = "Threshold Switch | Preise veraltet (Octopus) | On 90 / Off 30 (minutes) | Input = #2"
Z1_13 = "NOT | Keine Preise (Octopus) | — | I = #1"
Z1_14 = "OR | Störung Spotpreis, Teil 1 (Octopus) | — (prices outdated or no prices) | I1 = #12, I2 = #13"
Z1_15 = "OR | Störung Spotpreis (Octopus) | — (in addition: plugin does not report) | I1 = #14, I2 = output E of #11"
Z1_16 = "Switch-On Delay | Störung Spotpreis bestätigt (Octopus) | 300 s (swallows short gaps and the pulse of the threshold switch) | Input = #15"
Z1_17 = "Notification | Meldung Spotpreis gestört (Octopus) | Text: Octopus Dynamic – no valid electricity prices, or the plugin no longer reports (LoxBerry, plugin or MQTT gateway). Read the status “Spotpreis-Zustand (Octopus)” in the app; until then switching rules and releases release nothing | Input = #16"
Z1_18 = "Status | Spotpreis-Zustand (Octopus) | rows: V3 = 1 “plugin has not reported for 15 minutes – LoxBerry, plugin or MQTT gateway has stopped; in the plugin tab Test ‘Check MQTT gateway’, then ‘Send MQTT now’”; V1 = 0 “no valid prices – in the plugin tab Settings check ‘Octopus access’ (tariff dynamicOctopus required), then tab Test ‘Check login’ and ‘Fetch prices now’”; V2 >= 90 “prices not renewed for <v2> minutes – in the plugin tab Test ‘Fetch prices now’”; V4 = 1 “the price for this quarter hour is missing – calculated with the highest price of the day <v5.2> ct/kWh”; without condition “running – prices <v2> minutes old”; visualisation ON | V1 = #1, V2 = #2, V3 = output E of #11, V4 = #5, V5 = #4"
