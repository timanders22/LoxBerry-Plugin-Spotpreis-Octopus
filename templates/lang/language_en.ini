HTTP_BEFEHLE = "The plugin switches nothing, but Loxone can trigger four actions: price announcement, announcement of the prices for tomorrow, test push notification and fetching the prices again immediately. The first three are ready-made in the template below; if you create them by hand, create a <b>virtual output</b> (address: your own LoxBerry address) and one virtual output command per action with one of these addresses:"
M_MQTT_AN = "MQTT is switched on."
M_MQTT_AUS = "<b>MQTT is switched off.</b> Without the tick “Publish values via the MQTT gateway” on the <i>MQTT</i> tab nothing arrives this way, and the command bridge accepts nothing."
M_ABO_DATEI_JA = "For gateway V1 the plugin enters the subscription itself: the file %s contains %s (shipped with the plugin, kept in line with the prefix by the one-minute run)."
M_ABO_DATEI_NEIN = "The file %s does not contain the subscription %s yet – the next one-minute run enters it; until then enter it by hand under gateway V1."
M_S2_V2 = "Gateway V2 only subscribes ticked data points: under <i>System → MQTT Gateway → Subscriptions</i> the group %1$s appears. Tick these %2$d data points:"
M_HAKEN_AUF = "List of ticks: %d data points"
M_T_THEMA = "Topic"
M_T_NAME = "Name in Loxone"
M_T_NONCACHED = "Noncached"
M_T_BEREICH = "Unit/range"
M_NONCACHED = "Only the hourly prices <span class='sm-mono'>ph00</span> to <span class='sm-mono'>ph23</span> need “Noncached”: the plugin sends them anew every full hour, even unchanged, and V2 otherwise does not pass an equal value on to the Miniserver. No topic needs “Reset after send”. The hourly prices are only in the list if the hourly profile in the Settings tab is set to “absolute” or “both”."
M_RECONNECT = "After a restart of the Miniserver ok, alter, the switching signals and status_zaehler come by themselves within 60 s, the hourly prices at the next full hour; demo, audio, push, plan_budget, plan_budget2 and fix are retained; the rest is fetched by the central <span class='sm-mono'>reconnect</span> (sample project, page “LoxBerry MQTT-Gateway”) or by the next full set (after about 31 minutes at the latest)."
M_V1_BEFEHLE = "Under gateway V1 the subscription also takes the command topics and acknowledgements; the gateway creates inputs <span class='sm-mono'>…_befehl_…</span> for them. No command in the sample project has such a name – no loop arises."
M_KOPIEREN = "copy"
M_KOPIERT = "copied"
M_WEITERE = "Further topics (not on the sample pages)"
M_WEITERE_TEXT = "The plugin sends these topics as well; the sample pages do not need them. Under gateway V2 only tick them if you use them."
M_S3_DIGITAL = "Do not tick “Use as digital input” – not even for ok, neg or the switching signals; rank and level carry -1."
M_S3_FEHLWERT = "-999 means “not known” for prices and amounts of money (tomorrow not yet published, no window, no daily values in the month or in the last seven days yet); -1 for hours, rank, level and minutes. Exceptions: the rule prices regelN_ct are 0 without a plan, co2 and co2_min are 0 with CO₂ switched off, and a missing hour in the hourly profile carries the highest price of the day."
M_S3_RECHTE = "The LoxBerry user on the Miniserver needs rights to these inputs."
M_S3_MUSTER = "If you copy the pages from the sample project, you get the inputs with them."
M_S3_PRAEFIX = "Changed the prefix on the <i>MQTT</i> tab? Then all names change."
M_S4_KEINE = "The command list could not be read (bin/befehlsbruecke.php or bin/befehle_zuordnung.php is missing or broken) – see the <i>Test</i> tab."
M_S4_NICHTS = "Under gateway V1 and V2 nothing has to be entered or ticked for commands."
M_S4_SPERRE = "Lock time 60 s per command (lock minute of the bridge): a second press within one minute is acknowledged with “abgelehnt: Sperrminute”. The plugin also brakes itself – the two announcements together 20 s, the test push 10 s."
M_S4_HAKEN = "The tick “Accept commands via MQTT” (<i>MQTT</i> tab) is off – the bridge accepts nothing."
M_S4_VORLAGE = "The template creates an output of its own “Octopus Dynamic MQTT-Befehle” (address /dev/udp/&lt;LoxBerry&gt;/&lt;UDP port&gt;). If you use the sample project, take the commands on the shared output “LoxBerry MQTT-Gateway” instead (no. 28, 30 and 32 of the page “Spotpreis Octopus”)."
H_HTTP = "Existing installations: the HTTP path"
HTTP_ERKLAERUNG = "Up to 1.1.25 this was the second path of this plugin; it keeps working unchanged: address with action token, the template for command recognition and the command template “Octopus Dynamic Befehle” are here. Since 1.1.26 missing values with a sign carry -999 instead of -1 or 0 in the status line too (daily values, window, monthly comparison, shifted consumption) – if an existing installation checks for “= -1” or “= 0”, it will see -999 from now on."
HTTP_BEFEHLE_T = "Commands via HTTP"
DL_UNBEKANNT = "Unknown template – there are the template for command recognition (HTTP), the template for commands (virtual output) and the MQTT command template. The template for virtual inputs via MQTT has been dropped since 1.1.26 (name table in step 3)."

