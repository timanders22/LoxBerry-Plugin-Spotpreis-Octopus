HTTP_BEFEHLE = "Das Plugin schaltet nichts, aber Loxone kann vier Aktionen auslösen: Preisansage, Ansage der Preise für morgen, Test-Pushnachricht und Preise sofort neu holen. Die ersten drei stehen fertig in der Vorlage unten; wer von Hand anlegt, legt einen <b>virtuellen Ausgang</b> an (Adresse: die eigene LoxBerry-Adresse) und je Aktion einen virtuellen Ausgangsbefehl mit einer dieser Adressen:"
