M_NONCACHED = "Nur die Stundenpreise <span class='sm-mono'>ph00</span> bis <span class='sm-mono'>ph23</span> brauchen „Noncached“: das Plugin sendet sie zu jeder vollen Stunde neu, auch unverändert, und V2 reicht einen gleichen Wert sonst nicht an den Miniserver weiter. Kein Thema braucht „Zurücksetzen nach Senden“. Die Stundenpreise stehen nur in der Liste, wenn im Reiter Einstellungen das Stundenprofil auf „absolut“ oder „beides“ steht."
M_RECONNECT = "Nach einem Neustart des Miniservers kommen ok, alter, die Schaltsignale und status_zaehler binnen 60 s von selbst, die Stundenpreise zur nächsten vollen Stunde; demo, audio, push, plan_budget, plan_budget2 und fix sind zurückbehalten; den Rest holt der zentrale <span class='sm-mono'>reconnect</span> (Musterprojekt, Seite „LoxBerry MQTT-Gateway“) bzw. der nächste volle Satz (spätestens nach rund 31 Minuten)."
