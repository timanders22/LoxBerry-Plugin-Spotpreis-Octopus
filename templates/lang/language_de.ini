; Octopus Dynamic - Deutsch
;
; Jeder hier benutzte Schluessel muss auch in language_en.ini stehen.
; Jeden Wert in doppelte Anfuehrungszeichen setzen: bei parse_ini_file
; beginnt mit ; ein Kommentar, und JEDE HTML-Entitaet endet auf ein
; Semikolon (→ – ü). Ohne Anfuehrungszeichen wird der Wert
; dort stillschweigend abgeschnitten.
; Innerhalb eines quotierten Wertes darf kein doppeltes Anfuehrungszeichen
; mehr stehen - HTML-Attribute deshalb einfach quoten: <span class='sm-mono'>.

