[LOX]
H_SCHRITTE = "Schritt für Schritt"
S1_T = "Schritt 1: MQTT einschalten"
S1 = "<b>MQTT ist der Weg des LoxBerry-Plugins Musterprojekts</b> – für Werte und Befehle: das Plugin sendet seine Werte über den UDP-Eingang des MQTT-Gateways, das Gateway gibt sie an den Miniserver weiter, und Preisansage, Ansage der Preise für morgen und Test-Push kommen über die Befehlsbrücke zurück. Ab Werk ist MQTT eingeschaltet (Reiter <i>MQTT</i>). Der Weg über HTTP bleibt für bestehende Anlagen – unten zugeklappt."
S2_T = "Schritt 2: Das MQTT-Gateway"
S2 = "Die Themengruppe dieses Plugins lautet:"
S3_T = "Schritt 3: Virtuelle Eingänge anlegen"
S3 = "Je gebrauchtem Wert einen <b>Virtuellen Eingang</b> anlegen (nicht „Virtueller HTTP-Eingang“), Name genau wie in der Tabelle – unter diesem Namen liefert das MQTT-Gateway. Eine Vorlage für die Werte gibt es nicht: die Namen reichen. Die Tabelle nennt die Eingänge der fünf Musterseiten; alle weiteren Themen stehen zugeklappt darunter."
SP_BEDEUTUNG = "Bedeutung"
DL_HTTP = "Vorlage für Befehlserkennung (HTTP)"
DL_HILFE = "Die heruntergeladene Datei in Loxone Config über <b>Datei → Vorlagen → Vorlage einfügen</b> laden. Die HTTP-Vorlage enthält das Token in der Adresse — wird das Token neu gewürfelt, muss sie erneut geladen werden."
S4_T = "Schritt 4: Befehle"
S4 = "Preisansage, Ansage der Preise für morgen und Test-Push gehen über die <b>Befehlsbrücke</b>: Loxone sendet „publish …/befehl/&lt;name&gt; 1“ an den UDP-Eingang des MQTT-Gateways, die Brücke hört auf %s, prüft und ruft dieselbe Funktion wie der HTTP-Endpunkt. Im Reiter <i>MQTT</i> den Haken „Befehle über MQTT annehmen“ setzen – ab Werk aus. Alle drei Befehle sind harmlos; einen zweiten Haken gibt es nicht."
S5_T = "Schritt 5: Ausfallerkennung"
S5 = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Abruf aus, sieht in der App alles normal aus — nur die Preise stimmen nicht mehr. Drei Größen machen einen Ausfall sichtbar: <span class='sm-mono'>ok</span> (0 = keine Preise), <span class='sm-mono'>alter</span> (Minuten seit dem letzten erfolgreichen Abruf; ein Schwellwertschalter Ein 90 / Aus 30 Minuten meldet einen Ausfall, ohne dass ein einzelner verpasster Abruf Alarm auslöst) und der Laufzähler <span class='sm-mono'>status_zaehler</span>, der jede Minute eins weiterzählt. Steht der LoxBerry, das Plugin oder das MQTT-Gateway, bleibt auch <span class='sm-mono'>alter</span> auf seinem letzten Wert – dann verrät es nur der stehende Laufzähler an einer Analogwertvalidierung (Tmc 900 s). Die Seite „Spotpreis Octopus“ unten verbindet alle drei zu einer Störungsmeldung. An der Analogwertvalidierung im Eigenschaftsfenster den Haken bei ‚En‘ entfernen – sonst kommt die Konstante 1 als 0 an und die Meldung löst nie aus."
S6_T = "Schritt 6: Die Bausteine, fünf Seiten zum Nachbauen"
S6 = "Jede Tabelle von oben nach unten abarbeiten – danach ist die Seite nachgebaut. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5). Eine Zeile ist ein Baustein; ein UND oder ODER hat genau zwei Eingänge, und an jedem Eingang hängt genau eine Quelle."
B_TYP = "Baustein (Typ)"
B_NAME = "Name (Vorschlag)"
B_PARAM = "Parameter"
B_EIN = "Eingänge verbinden mit"
S7_T = "Schritt 7: Gegenprobe"
S7 = "In Loxone Config den Wert von %s ansehen – er ändert sich jede Minute. Danach im Reiter <i>Test</i> auf <b>MQTT jetzt senden</b> klicken: die Eingänge müssen die Werte zeigen, die im Reiter <i>MQTT</i> in der Spalte <b>aktuell</b> stehen. Stimmen sie nicht überein, fehlt unter V1 das Abo bzw. unter V2 der Haken (Schritt 2), oder der Name des Eingangs weicht ab (Schritt 3)."
BS_SP_NR = "#"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
BILD_ALT = "Bausteine des Plugins in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
BAUSTEINE_VORTEXT = "Fünf Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Wer nur den Preis sehen und gemeldet bekommen will, übernimmt die erste allein; jede weitere Seite steht für sich (keine Leitung geht über eine Seitengrenze). Die Namen der virtuellen Eingänge folgen dem eingestellten MQTT-Präfix „%s“."
DL_VQ = "Vorlage für Befehle (virtueller Ausgang)"
DL_PROFIL = "Die Stundenpreise <span class='sm-mono'>ph00</span> bis <span class='sm-mono'>ph23</span> sendet das Plugin nur, wenn im Reiter Einstellungen „Stundenprofil für den Spot Price Optimizer“ auf „absolut“ (oder „beides“) steht – ab Werk ist es aus (für die Seite „Spotpreis Octopus Stundenprofil“)."
VQ_HILFE = "Die Vorlage „Octopus Dynamic Befehle“ enthält die Befehle Preisansage, Ansage Preise morgen und Test-Push samt Adresse und Aktionstoken; in Loxone Config unter Peripherie → Virtuelle Ausgänge → Vorlage importieren einlesen. Nach „Neues Token erzeugen“ neu herunterladen. „refresh“ steht bewusst nicht darin: der Minutentakt holt die Preise ohnehin alle 15 Minuten."
VQ_KOMMENTAR = "Octopus Dynamic: Befehle, enthält das Aktionstoken"
VQ_K_ANSAGE = "Octopus: Preisansage jetzt"
VQ_K_ANSAGE_MORGEN = "Octopus: Ansage Preise morgen"
VQ_K_TESTPUSH = "Octopus: Test-Pushnachricht"
BS1_KOPF = "Spotpreis Octopus – läuft das Plugin? Preis jetzt, Meldungen und Ansage"
BS1_S1 = "Im Plugin Reiter „Einstellungen“ unter „Zugang zu Octopus“ E-Mail-Adresse, Passwort und Kundennummer eintragen (Tarif dynamicOctopus nötig; ohne Vertrag den „Demo-Modus“ einschalten) und speichern. Reiter „Test“ → „Preise jetzt abrufen“: danach stehen die Preise im Diagramm. Wer auch die Seite „Spotpreis Octopus Stundenprofil“ übernimmt, stellt jetzt „Stundenprofil für den Spot Price Optimizer“ auf „absolut“ und speichert – nur dann sendet das Plugin die Stundenpreise."
BS1_S2 = "Im Plugin Reiter „MQTT“ prüfen, dass MQTT eingeschaltet ist. Gateway V1: das Abo „octopus/#“ trägt das Plugin selbst ein; Gateway V2: die Datenpunkte der Hakenliste anhaken (Schritt 2 oben). Wer Preisansage, Ansage morgen und Test-Push nutzt, setzt im Reiter „MQTT“ den Haken „Befehle über MQTT annehmen“."
BS1_S3 = "Schritt 3 oben: je Wert einen Virtuellen Eingang anlegen, Name genau wie in der Namenstabelle (Knopf „kopieren“) – „Als Digitaleingang verwenden“ nicht anhaken. Eine Vorlage für die Werte gibt es nicht; die Eingänge dienen allen fünf Seiten. Wer das Musterprojekt kopiert, bekommt sie mit."
BS1_S4 = "Seite „Spotpreis Octopus“ anlegen. Die 13 Eingänge der Liste ziehen (Nr. 1–9, 20, 21, 24, 33) und die drei Befehle Nr. 28, 30 und 32 am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ anlegen (Befehl bei EIN wie in der Liste, Befehl bei AUS leer; gibt es den Ausgang noch nicht: Schritt 4 oben, „Vorlage MQTT-Befehle“), dazu die Konstante 1. An octopus_cur im Eigenschaftsfenster „Statistik“ einschalten."
BS1_S5 = "Drei Virtuelle Eingänge (Taste) anlegen: „Taste Preisansage (Octopus)“, „Taste Ansage Preise morgen (Octopus)“, „Taste Test-Push (Octopus)“. Drei Benachrichtigungen anlegen: „Meldung Spotpreis gestört (Octopus)“, „Meldung Strompreis-Push (Octopus)“, „Meldung Test-Push (Octopus)“, Text wie in der Liste; jede bekommt genau eine Leitung."
BS1_S6 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 11: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. „Spotpreis-Zustand (Octopus)“ und „Strompreis jetzt (Octopus)“ vorher einmal „+“ (V5); die Statuszeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
BS1_S7 = "Text Generator Nr. 26 nur bei Ausgabeart „Original Loxone Audioserver“: die Leitungen Nr. 25 → Tr und Nr. 4 → V1 von Hand ziehen und den Text eintragen. Bei jeder anderen Ausgabeart Nr. 25 und 26 weglassen, sonst kommt die Ansage doppelt."
BS1_S8 = "Speichern und übertragen. Probe: „Spotpreis-Zustand (Octopus)“ zeigt „läuft – Preise … Minuten alt“, octopus_status_zaehler zählt jede Minute weiter; im Plugin Reiter „Test“ „MQTT jetzt senden“ – die Werte in Loxone gleichen der Spalte „aktuell“ im Reiter „MQTT“. „Taste Test-Push (Octopus)“ drücken: innerhalb einer Minute kommt die „Meldung Test-Push (Octopus)“."
BS1_H1 = "Die Störungsmeldung kommt nach 5 Minuten ohne Preise oder mit veralteten Preisen (über 90 Minuten); stehen LoxBerry, Plugin oder MQTT-Gateway ganz, nach rund 20 Minuten. Während eines Plugin-Updates pausiert das Plugin – eine Meldung dabei ist kein Fehler."
BS1_H2 = "Steht der LoxBerry, behalten alle Eingänge ihren letzten Wert, auch octopus_alter; nur der stehende Laufzähler (Nr. 3 an der Analogwertvalidierung Nr. 11) verrät es."
BS1_H3 = "Zu Nr. 11: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
BS1_H4 = "Die Preismeldung (Nr. 23) kommt zu den Stunden, die im Plugin unter „Ansage und Benachrichtigung“ angehakt sind, und nur mit „Push-Nachricht freigeben“. Störung, Preismeldung und Test-Push haben je eine eigene Benachrichtigung: eine Benachrichtigung sendet nur beim Wechsel von Aus auf Ein."
BS1_H5 = "Ein zweiter Druck auf eine Taste innerhalb von 60 Sekunden wird von der Befehlsbrücke mit „abgelehnt: Sperrminute“ quittiert; das Plugin selbst nimmt die Ansagen höchstens alle 20 Sekunden und den Test-Push alle 10 Sekunden an. Die Befehle wirken nur mit dem Haken „Befehle über MQTT annehmen“; ein Aktionstoken brauchen sie nicht."
BS1_H6 = "Status-Eingänge ab V5 gibt es erst nach einem Klick auf das „+“ am Baustein."
BS2_KOPF = "Spotpreis Octopus Steuerung – die vier Schaltregeln mit Absicherung"
BS2_S1 = "Im Plugin Reiter „Einstellungen“ unter „Schaltregeln“ die gebrauchten Regeln einschalten („Schaltregel 1 benutzen“ …) und einrichten (Art, z. B. die N günstigsten Stunden am Stück, Anzahl, Zeitfenster, Frist); wer mehrere große Verbraucher hat, unter „Fahrplaner“ das Leistungsbudget eintragen. Speichern."
BS2_S2 = "Neue Seite „Spotpreis Octopus Steuerung“ anlegen und die 25 Eingänge der Liste ziehen (Nr. 1–24, dazu octopus_status_zaehler ein weiteres Mal als Nr. 25 – die Eingänge aus Schritt 3 oben, nicht neu anlegen), dazu die Konstante 1."
BS2_S3 = "Analogwertvalidierung, vier UND und vier Status über F5 setzen, Parameter wie in der Liste. Analogwertvalidierung Nr. 27: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. An jedem UND (Nr. 28–31) den Eingang I2 negieren: einmal auf den Eingangspunkt von I2 klicken, danach zeigt der Eingang einen kleinen Kreis; dann I2 mit dem Ausgang E von Nr. 27 verbinden."
BS2_S4 = "Jeder Status „Schaltregel 1 (Octopus)“ bis „Schaltregel 4 (Octopus)“ braucht vorher dreimal „+“ (bis V7); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
BS2_S5 = "Die Ausgänge Q von Nr. 28–31 an die eigenen Geräte der Regeln anschließen. Speichern und übertragen. Probe: sobald eine Regel eingerichtet ist, zeigt ihr Status „wartet – Start in … min“ oder „läuft“."
BS2_H1 = "Fallen die Preise aus, setzt das Plugin die Schaltsignale selbst auf 0. Steht der LoxBerry, fallen die UND-Bausteine nach 15 Minuten ab, und der Status zeigt „ausgesetzt“."
BS2_H2 = "Die Schaltsignale octopus_regel1_aktiv bis octopus_regel4_aktiv gehen seit 1.1.25 bei jedem Lauf des Plugins (jede Minute) hinaus, nicht nur bei einer Änderung: geht am MQTT-Gateway eine Nachricht verloren, steht das richtige Signal eine Minute später an."
BS2_H3 = "Zu Nr. 27: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
BS2_H4 = "Octopus rechnet in Viertelstunden: „Start in“ und „Rest“ sind Minuten, die Zahl „ans Leistungsbudget verloren“ zählt Viertelstunden. Wer nur eine Regel braucht, übernimmt deren sechs Befehle, ihr UND und ihren Status; Laufzähler, Konstante und Analogwertvalidierung bleiben."
BS2_H5 = "Status-Eingänge ab V5 gibt es erst nach einem Klick auf das „+“ am Baustein."
BS3_KOPF = "Spotpreis Octopus Werte – heute, morgen, günstigstes Fenster und Fahrplaner"
BS3_S1 = "Neue Seite „Spotpreis Octopus Werte“ anlegen und die 24 Eingänge der Liste ziehen (Nr. 1–24; die Eingänge aus Schritt 3 oben, nicht neu anlegen). An octopus_cur_h im Eigenschaftsfenster „Statistik“ einschalten."
BS3_S2 = "Benachrichtigung „Meldung Preise für morgen (Octopus)“ anlegen, Text wie in der Liste."
BS3_S3 = "Vier Status, Gleich und Einschaltverzögerung über F5 setzen. „+“ vorher: „Strompreise heute (Octopus)“ viermal, „Strompreise morgen (Octopus)“ zweimal, „Fahrplaner (Octopus)“ zweimal. Bei „Gleich“ Nr. 29 den zweiten Eingang offen lassen und V2 = 0 im Eigenschaftsfenster eintragen."
BS3_S4 = "Ausgang Q von Nr. 30 an ein Gerät, das im günstigsten Fenster starten soll. Speichern und übertragen. Probe: „Strompreise heute (Octopus)“ mit dem Diagramm im Plugin (Reiter „Einstellungen“) vergleichen."
BS3_H1 = "Die Länge des günstigsten Fensters stellt man im Plugin ein; Nr. 30 ist ein fertiger Schaltausgang für ein Gerät mit Startfreigabe."
BS3_H2 = "Die Meldung „Preise für morgen“ kommt einmal am Tag, sobald die Preise veröffentlicht sind. Wird das Programm übertragen, während octopus_morgen_ok schon 1 ist, kommt an diesem Tag keine."
BS3_H3 = "„Fahrplaner (Octopus)“ zeigt PV-Prognose, Speicherstand und Leistungsbudget, mit denen die Schaltregeln rechnen; die Quellen trägt man im Plugin unter „Fahrplaner“ ein."
BS3_H4 = "Status-Eingänge ab V5 gibt es erst nach einem Klick auf das „+“ am Baustein."
BS4_KOPF = "Spotpreis Octopus Freigaben und Tarif – günstig freigeben, teuer sperren, Strommix, Tarifvergleich"
BS4_S1 = "Neue Seite „Spotpreis Octopus Freigaben und Tarif“ anlegen und die 15 Eingänge der Liste ziehen (Nr. 1–6 als weitere Instanzen, Nr. 18–21, 23–27; die Eingänge aus Schritt 3 oben), dazu die Konstante 1. An octopus_co2 im Eigenschaftsfenster „Statistik“ einschalten."
BS4_S2 = "Analogwertvalidierung Nr. 8: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. Am UND Nr. 9 den Eingang I2 negieren: einmal auf den Eingangspunkt von I2 klicken, danach zeigt der Eingang einen kleinen Kreis."
BS4_S3 = "„Kleiner oder gleich“ Nr. 10, „Größer oder gleich“ Nr. 11 und „Gleich“ Nr. 15: den zweiten Eingang offen lassen und V2 im Eigenschaftsfenster eintragen (16, 1 und 3)."
BS4_S4 = "Drei Status setzen; „Freigaben jetzt (Octopus)“ und „Tarifvergleich (Octopus)“ vorher einmal „+“ (V5). Zeilen in der angegebenen Reihenfolge, die ohne Bedingung zuletzt."
BS4_S5 = "Die Ausgänge Q von Nr. 14 (Freigabe große Verbraucher), Nr. 16 (Sperre bei Hochpreis) und Nr. 21 (Strommix sauber) an die eigenen Verbraucher anschließen. Speichern und übertragen."
BS4_H1 = "-1 heißt „Rang unbekannt“ und erfüllt „kleiner oder gleich“ auch – deshalb das UND mit „Rang bekannt“ (Nr. 11, 12). Abends, solange weniger als 12 künftige Preisstunden bekannt sind, gibt Nr. 14 nur bei negativem Preis frei."
BS4_H2 = "Die Freigaben schalten nur mit gültigen Preisen und lebendem Plugin (Nr. 9) und ohne Verzögerung; steht der LoxBerry, fallen sie nach 15 Minuten ab."
BS4_H3 = "Zu Nr. 8: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
BS4_H4 = "Wie viele Viertelstunden „günstig“ sind, steht an Nr. 10 (16 = 4 Stunden); „teuer“ rechnet das Plugin selbst gegen seine Schwelle (ab Werk 35 ct). CO₂-Schwelle und den festen Vergleichspreis stellt man im Plugin ein."
BS4_H5 = "Status-Eingänge ab V5 gibt es erst nach einem Klick auf das „+“ am Baustein."
BS5_KOPF = "Spotpreis Octopus Stundenprofil – der Loxone-Baustein Spotpreis-Optimierer"
BS5_S1 = "Im Plugin Reiter „Einstellungen“ „Stundenprofil für den Spot Price Optimizer“ auf „absolut“ stellen und speichern – ab Werk ist es aus, und ohne diese Einstellung sendet das Plugin keine Stundenpreise. Dann die 24 Virtuellen Eingänge octopus_ph00 bis octopus_ph23 anlegen (Schritt 3 oben, Name genau so); unter Gateway V2 als „Noncached“ anhaken."
BS5_S2 = "Neue Seite „Spotpreis Octopus Stundenprofil“ anlegen und die 24 Eingänge ziehen (Nr. 1–24), dazu octopus_ok ein weiteres Mal als Nr. 30. „Impuls um“ Nr. 25 auf „Zu bestimmter Uhrzeit“, 00:05:00 stellen, „Impuls um“ Nr. 28 auf 00:35:00; das ODER Nr. 29 fasst beide zusammen."
BS5_S3 = "Spotpreis-Optimierer über F5 setzen und im Eigenschaftsfenster den Modus „Absolut“ wählen. Config warnt dabei und empfiehlt „Spotmarkt“ – die Warnung mit „Ja“ bestätigen. „Spotmarkt“ ist die Alternative ganz ohne Plugin: Loxone holt dann die Börsenpreise selbst, ohne den Endpreis von Octopus. Formelfeld leer, Bedarf 4 h, Periode 24 h, Mindestlaufzeit 1 h."
BS5_S4 = "Von Hand verbinden: die Eingänge 00:00 bis 23:00 der Reihe nach mit octopus_ph00 bis octopus_ph23, Tr mit dem Ausgang von Nr. 29, die Eingänge des ODER Nr. 29 mit den Ausgängen Q von Nr. 25 und Nr. 28; die Ausgänge Cv, Min, Max, Avg und O an V1 bis V5 des Status Nr. 27 und octopus_ok (Nr. 30) an V6 (vorher zweimal „+“)."
BS5_S5 = "Ausgang O an den eigenen Verbraucher anschließen. Speichern und übertragen."
BS5_H1 = "Der Spotpreis-Optimierer rechnet in ganzen Stunden; die Viertelstunden von Octopus gehen dabei verloren. Feiner schalten die Schaltregeln der Seite „Spotpreis Octopus Steuerung“ – wer sie nutzt, braucht diese Seite nicht."
BS5_H2 = "Der Baustein übernimmt einen Stundenwert nur, wenn er innerhalb der laufenden Stunde aktualisiert wurde; das Plugin sendet die 24 Stundenpreise deshalb zu jeder vollen Stunde neu (unter Gateway V2 „Noncached“). Die Nachberechnung um 00:35 holt Stundenpreise nach, die der Gateway-Eingang um Mitternacht verloren hat."
BS5_H3 = "Preise in ct statt EUR: die Reihenfolge der Stunden bleibt gleich, der Parameter „Max“ gilt dann in ct. Alle 33 Leitungen dieser Seite werden von Hand gezogen (Schritt 4)."
