H_PROFIL = "Der Spot Price Optimizer von Loxone hat <b>24</b> Preiseingänge, Viertelstunden nimmt er nicht an. Deshalb werden die vier Viertelstunden je Stunde gemittelt. Für die Regeln oben ändert das nichts - die rechnen weiter auf Viertelstunden."
