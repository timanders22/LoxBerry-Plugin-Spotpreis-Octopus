ERKLAERUNG = "Bis 0.9.0 lieferte das Plugin nur Zahlen: Startzeit, Minuten bis dahin, Durchschnittspreis. Daraus „jetzt laden“ zu machen war Arbeit im Miniserver. Eine Schaltregel beantwortet die Frage hier und gibt eine <b>Eins oder eine Null</b> aus. Jede Regel kennt ein Zeitfenster und einen Horizont - damit lässt sich „die 3 günstigsten Stunden zwischen 22 und 6 Uhr“ beantworten. <b>Octopus rechnet in Viertelstunden</b>: die Regeln arbeiten auf Viertelstunden, <span class='sm-mono'>in</span> und <span class='sm-mono'>rest</span> zählen deshalb in Minuten. Bei „günstigste volle Stunden“ wird bewusst auf ganze Stunden gemittelt - sonst schaltet die Wallbox im Viertelstundentakt."
