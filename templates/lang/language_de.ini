[LOX]
H_SCHRITTE = "Schritt für Schritt"
S1_T = "Schritt 1: Weg festlegen"
S1 = "<b>MQTT ist der Regelweg.</b> Der Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt ein passend benannter virtueller Eingang. Der Weg über HTTP verlangt je Wert eine eigene Befehlserkennung und ist nur die Rückfallebene — sinnvoll, wenn der Gateway bewusst nicht genutzt wird."
S2_T = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2 = "System → MQTT Gateway → Reiter <b>Subscriptions</b> → diese Zeile hinzufügen und speichern:"
S2_WARN = "Ohne diesen Eintrag kommt am Miniserver nichts an."
S3_T = "Schritt 3: Virtuelle Eingänge anlegen"
S3 = "In Loxone Config unter <b>Virtuelle Eingänge</b> je gebrauchtem Wert einen Eingang anlegen. Der Titel muss genau so heißen, wie der Gateway ihn bildet (Präfix und Schrägstrich werden zu einem Unterstrich). Wer nicht alle braucht, legt nur die an, die er verwendet."
SP_TITEL = "Titel des virtuellen Eingangs"
SP_EINHEIT = "Einheit"
SP_BEDEUTUNG = "Bedeutung"
DL_MQTT = "Vorlage für virtuelle Eingänge (MQTT)"
DL_HTTP = "Vorlage für Befehlserkennung (HTTP)"
DL_HILFE = "Die heruntergeladene Datei in Loxone Config über <b>Datei → Vorlagen → Vorlage einfügen</b> laden. Die HTTP-Vorlage enthält das Token in der Adresse — wird das Token neu gewürfelt, muss sie erneut geladen werden."
S4_T = "Schritt 4: Befehle senden"
S4 = "Das Plugin schaltet nichts, aber Loxone kann drei Aktionen auslösen. Dafür einen <b>virtuellen Ausgang</b> anlegen (Adresse: die eigene LoxBerry-Adresse) und je Aktion einen virtuellen Ausgangsbefehl mit einer dieser Adressen:"
S5_T = "Schritt 5: Ausfallerkennung"
S5 = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Abruf aus, sieht in der App alles normal aus — nur die Preise stimmen nicht mehr. Deshalb <span class='sm-mono'>alter</span> auswerten: der Wert zählt die Minuten seit dem letzten erfolgreichen Abruf. Ein Schwellwertschalter, der bei über 90 Minuten anspricht, meldet zuverlässig einen Ausfall, ohne dass ein einzelner verpasster Durchlauf schon Alarm auslöst (der Cron läuft minutlich, die Preise werden alle 15 Minuten neu geholt). Zusätzlich <span class='sm-mono'>ok</span> prüfen — steht es auf 0, liegen überhaupt keine Preise vor."
S6_T = "Schritt 6: Komplette Baustein-Liste zum Nachbauen"
S6 = "Diese Tabelle von oben nach unten abarbeiten — danach ist die Funktion nachgebaut. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5). Die Zeilen 15 bis 22 sind optional; wer nur den Preis anzeigen will, braucht die Zeilen 1 bis 12."
B_TYP = "Baustein (Typ)"
B_NAME = "Name (Vorschlag)"
B_PARAM = "Parameter"
B_EIN = "Eingänge verbinden mit"
B_ERKLAERUNG = "<b>Zu #6:</b> <span class='sm-mono'>alter</span> ist die einzige Größe, die einen Ausfall sichtbar macht — alle anderen behalten ihren letzten Wert. <b>Zu #16:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang hängen, sondern erst über ODER zusammenführen — sonst verschluckt eine dauerhaft aktive Quelle alle übrigen. <b>Zu #18:</b> Die Schwelle liegt bewusst deutlich über dem Abholtakt, damit ein einzelner verpasster Durchlauf keine Meldung auslöst. <b>Zu #21:</b> Beim Original Loxone Audioserver läuft die Sprachausgabe über den Textgenerator, nicht über das Plugin."
