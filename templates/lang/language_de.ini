[EM]
EINLEITUNG = "Zwei Bausteine kommen in Frage, und sie tun <b>nicht</b> dasselbe. Der <b>Spot Price Optimizer</b> rechnet mit Preisen und schaltet in den günstigsten Stunden. Der <b>Energiemanager</b> verteilt <b>Überschuss</b> aus der PV-Anlage nach Priorität - er hat keinen Preiseingang."
EM_HINWEIS = "Der Energiemanager kennt keinen Preis. Er sieht Netzbezug, Erzeugung, Speicherleistung und Ladezustand. Die Regeln dieses Plugins wirken deshalb nur mittelbar: sie erlauben Netzbezug, erzwingen einen Start oder heben den Mindestladestand. Wer <b>ausschließlich</b> preisgesteuert schalten will, hängt den Regelausgang direkt an den Verbraucher - ganz ohne Energiemanager."
EM_TEXT = "Der Energiemanager verteilt Überschuss. Die Schaltregeln greifen an drei Stellen ein - alle drei sind im Baustein verbindbare Eingänge:"
H_EM = "Energiemanager - er hat keinen Preiseingang"
H_SPOTOPT = "Spot Price Optimizer - hierher gehört das Stundenprofil"
H_TITEL = "Zusammenspiel mit den Energie-Bausteinen"
SPOTOPT_TEXT = "Diesen Baustein gibt es in Loxone Config bereits: er schaltet eine bestimmte Anzahl Stunden (<i>Bedarf</i>) innerhalb eines Zeitraums (<i>Periode</i>) zu den niedrigsten Preisen ein. Im Modus <b>Spot Markt</b> holt er Börsenpreise selbst - das ist für Octopus aber der falsche Preis: der Tarif dynamicOctopus liefert bereits den fertigen <b>Bruttopreis</b> einschließlich aller Bestandteile, während der Baustein Börsenpreise ohne Steuern bekommt und eine Formel erwartet. Deshalb: Baustein auf <b>Absolut</b> oder <b>Relativ</b> stellen, Formelfeld leer lassen und die Werte von hier nehmen."
SPOTOPT_WARNUNG = "<b>Zweierlei ist zu beachten.</b> Erstens: Kommen die Preise von einem virtuellen HTTP-Eingang, benutzt der Baustein einen Wert nur, wenn er <b>innerhalb der laufenden Stunde</b> aktualisiert wurde - sonst verwirft er ihn als veraltet. Zweitens: Der Baustein rechnet in <b>ganzen Stunden</b>. Die Viertelstundenauflösung von Octopus geht dabei verloren. Wer sie braucht, nimmt die Schaltregeln dieses Plugins - die rechnen auf Viertelstunden."
T_ANSCHLUSS = "Anschluss am Baustein"
T_BEDEUTUNG = "Bedeutung"
T_VONHIER = "Von diesem Plugin"
Z_ABSOLUT = "Modus <b>Absolut</b>: je Eingang der Preis einer Tagesstunde. ph00 an 00:00, ph01 an 01:00 und so weiter."
Z_MINSOC = "Mindestladestand anheben, solange die Regel greift (z. B. 80 % statt 10 %). Der Speicher wird dann mit höchster Priorität geladen - zusammen mit einem positiven Offset auch aus dem Netz."
Z_OFF = "Sperren, wenn der Preis hoch ist: statt eines Verbrauchers den ganzen Baustein anhalten. Nur sinnvoll, wenn <b>alle</b> Lasten preisabhängig sein sollen."
Z_OFFSET = "Netzbezug erlauben, solange die Regel greift. Ein positiver Wert in kW heißt: es darf importiert werden - damit laufen Lasten auch ohne PV-Überschuss."
Z_PRIO = "Nummer der Last (1-12) aufschalten, solange die Regel greift. Startet genau diese Last sofort. Mit einem Formel-Baustein: Regel aktiv → Lastnummer, sonst 0."
Z_RELATIV = "Modus <b>Relativ</b>: je Eingang der Preis in N Stunden. pr00 an +0, pr01 an +1 und so weiter."
Z_TRIGGER = "Auslöser für die Neuberechnung - z. B. der Tagesimpuls oder das Einstecken des Fahrzeugs. Ohne Auslöser rechnet der Baustein nicht neu."

[PLAN]
H_TITEL = "Fahrplaner - Rangfolge, Leistungsbudget und PV-Prognose"
ERKLAERUNG = "Bis 0.9.2 rechnete jede Schaltregel für sich. Wärmepumpe, Wallbox und Waschmaschine fanden dieselbe günstigste Stunde und schalteten gleichzeitig. Der Fahrplaner ändert drei Dinge: Regeln können eine <b>Frist</b> und einen Energiebedarf haben, sie teilen sich ein <b>Leistungsbudget</b> nach Rangfolge, und eine <b>PV-Prognose</b> verschiebt den Fahrplan in die Sonnenstunden. Alles drei ist ab Werk aus - wer nichts einstellt, bekommt das Verhalten von vorher."
L_BUDGET_KW = "Leistungsbudget (kW)"
H_BUDGET_KW = "So viel darf gleichzeitig laufen. Wird es eng, bekommt die Regel mit dem kleineren Rang die Stunde und die andere weicht aus. 0 = kein Budget, dann dürfen alle gleichzeitig."
L_PV_BONUS = "PV-Gutschrift (ct/kWh)"
H_PV_BONUS = "Wird vom Preis einer Stunde abgezogen, wenn dafür eine PV-Prognose vorliegt. Damit gewinnt die sonnige Mittagsstunde gegen die billige Nachtstunde. Ein sinnvoller Wert ist der Unterschied zwischen Bezugspreis und Einspeisevergütung - was Sie sparen, wenn Sie den Strom selbst verbrauchen. 0 = aus."
L_PV_SCHWELLE = "Volle Gutschrift ab (Wh je Viertelstunde)"
H_PV_SCHWELLE = "Die Gutschrift steigt linear bis zu diesem Wert und bleibt dann stehen. Eine reine Ja/Nein-Schwelle wäre eine Klippe - der Fahrplan spränge bei einer minimal geänderten Prognose um Stunden."
