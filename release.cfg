[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Sie ist scharf geschaltet: die Adressen zeigen auf das
# eigene Repository und auf den Tag, der unter VERSION steht;
# AUTOMATIC_UPDATES in der plugin.cfg steht auf true.
#
# (Bis 1.1.3 stand hier 'den Tag v0.9.1' - eine Zahl, die seit vielen
# Fassungen nicht mehr stimmte. Sie hat niemanden gestoert, weil sie nur
# im Kommentar stand; genau so faellt eine falsche Angabe irgendwann in
# den Code.)
#
# Bei jedem weiteren Release:
#   1. VERSION hier UND in plugin.cfg auf denselben Wert setzen
#   2. beide Adressen auf den Tag vX.Y.Z zeigen lassen
#   3. auf GitHub ein Release mit genau diesem Tag anlegen
#   4. AUTOMATIC_UPDATES in plugin.cfg auf true, RELEASECFG dort eintragen
#   5. nachpruefen: Tag ueber git/ref/tags/<Tag>, Release ueber releases,
#      und die Archivadresse gegen eine erfundene Fassung gegentesten -
#      die echte laedt herunter, die erfundene zeigt 404: Not Found
# Fehlt eine der Stellen, sieht LoxBerry das Update nicht oder laedt ein
# Archiv, das es nicht gibt.

VERSION=1.1.5
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/archive/refs/tags/v1.1.5.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-Octopus/releases/tag/v1.1.5
